name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test non-workerd suite
        shell: bash
        run: |
          test_files=()
          while IFS= read -r test_file; do
            test_files+=("${test_file}")
          done < <(
            find test -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) \
              ! -path 'test/workerd/*.harness.test.ts' \
              -print | sort
          )
          if (( ${#test_files[@]} == 0 )); then
            echo "No non-workerd test files found" >&2
            exit 1
          fi
          bun test "${test_files[@]}"

      - name: Test workerd harnesses sequentially
        shell: bash
        run: |
          for harness in test/workerd/*.harness.test.ts; do
            echo "Running ${harness}"
            bun test "${harness}"
          done

      - name: Build package
        run: bun run build

      - name: Build landing page
        run: bun run --cwd landing build

      - name: Pack and smoke-test package
        shell: bash
        run: |
          tarball="$(npm pack --ignore-scripts)"
          bun scripts/smoke-packed-package.mjs "${tarball}"
          bun scripts/smoke-generated-project.mjs "${tarball}"
          bun scripts/smoke-packed-chat.mjs "${tarball}"

      - name: Install packed chat consumer
        working-directory: example/chat
        run: npm ci

      - name: Typecheck chat consumer
        working-directory: example/chat
        run: npm run typecheck

      - name: Build chat consumer
        working-directory: example/chat
        run: npm run build

      - name: Test chat consumer
        working-directory: example/chat
        run: npm run test:e2e
