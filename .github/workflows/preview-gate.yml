name: Preview release gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-tarball:
    name: Exact tarball on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      CDB_BROWSER_E2E_PLATFORM_NAME: github-ubuntu-24.04-x64
      WRANGLER_SEND_METRICS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Verify browser runtime
        run: google-chrome --version

      - name: Run the exact-tarball preview gate
        run: bun run preview:gate -- --output-dir artifacts/preview --platform-name github-ubuntu-24.04-x64

      - name: Finalize independently verifiable evidence
        if: success()
        run: bun run preview:finalize -- --directory artifacts/preview

      - name: Upload immutable preview evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chardb-preview-${{ github.sha }}
          path: artifacts/preview
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact identity
        if: always()
        run: |
          echo "Artifact digest: ${{ steps.upload.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/preview/evidence-manifest.json ]; then
            echo "Candidate SHA-256: $(jq -r '.candidate.digest' artifacts/preview/evidence-manifest.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
