name: Live scale benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reproducible workload profile
        required: true
        default: client-max-accepted
        type: choice
        options:
          - ci-smoke
          - client-max-accepted
          - throughput
      samples:
        description: Repeated samples (1-20)
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live scale benchmark
        env:
          SCALE_PROFILE: ${{ inputs.profile }}
          SCALE_SAMPLES: ${{ inputs.samples }}
        run: |
          bun run bench:live \
            --profile "$SCALE_PROFILE" \
            --samples "$SCALE_SAMPLES" \
            --output-dir scale-results

      - name: Upload scale results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-scale-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: scale-results/
          if-no-files-found: warn
          retention-days: 14
